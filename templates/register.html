<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | AI Interview Prep</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="container">

            <div class="logo">
                AI Interview Prep
            </div>

            <ul class="nav-links">

                <li>
                    <a href="/">Home</a>
                </li>

                <li>
                    <a href="/login">Login</a>
                </li>

            </ul>

        </div>

    </nav>


    <!-- REGISTER FORM -->

    <div class="form-container">

        <h1>Create Account</h1>

        <form method="POST">

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn"
                style="width: 100%;"
            >
                Create Account
            </button>

        </form>


        <p style="text-align: center; margin-top: 20px;">

            Already have an account?

            <a href="/login">
                Login
            </a>

        </p>


        <p style="text-align: center; margin-top: 10px;">

            <a href="/">
                ← Back to Home
            </a>

        </p>

    </div>


    <!-- JAVASCRIPT -->

    <script
        src="{{ url_for('static', filename='js/script.js') }}">
    </script>

</body>

</html>
